  build_macos_wheels:
    name: Build wheels for macOS ${{ matrix.macos_version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14
          - macos_version: "14"
            runner: "macos-14"
            arch: "arm64"
          - macos_version: "14"
            runner: "macos-14"
            arch: "x86_64"

          # macOS 15
          - macos_version: "15"
            runner: "macos-15"
            arch: "arm64"
          - macos_version: "15"
            runner: "macos-15"
            arch: "x86_64"

          # - macos_version: "26"
          #   runner: "macos-26"
          #   arch: "arm64"
          # - macos_version: "26"
          #   runner: "macos-26"
          #   arch: "x86_64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Required for cibuildwheel to get a clean version number.
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.2
        env:
          MACOSX_DEPLOYMENT_TARGET: "${{ matrix.macos_version }}.0"
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          # CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_MACOS: "${{ matrix.arch }}"
          CIBW_BEFORE_BUILD: >
            brew install pybind11 opencv &&
            brew reinstall --build-from-source sdl2

      - name: Store wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheels-${{ matrix.runner }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_windows_wheels:
    name: Build wheels for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: vcpkg
        with:
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.19.2
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_BEFORE_BUILD_WINDOWS: >
            pip install pybind11 && vcpkg install
          CIBW_ENVIRONMENT: "CMAKE_TOOLCHAIN_FILE='${{ github.workspace }}\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake'"

      - name: Store wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: ./wheelhouse/*.whl

  publish_to_pypi:
    name: Publish wheels to PyPI
    needs: [build_windows_wheels, build_macos_wheels]
    # needs: [build_macos_wheels, build_linux_wheels]
    runs-on: ubuntu-latest
    # if: github.event_name == 'release' && github.event.action == 'created'

    steps:
      - name: Download all wheels from artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

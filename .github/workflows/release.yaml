# .github/workflows/release.yml

name: Build and Publish to PyPI

# This action runs when you create a new release on GitHub.
on:
  release:
    types: [created]
  # Allows you to run this workflow manually from the Actions tab for testing.
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build_and_publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install C++ dependencies with vcpkg
        uses: microsoft/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          runInstall: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels for all platforms
        uses: pypa/cibuildwheel@v2.17.0
        env:
          CIBW_CMAKE_ARGS: -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          CIBW_ARCHS_LINUX: auto aarch64
          CIBW_SKIP: "*-win32* *-manylinux_i686*"

      # - name: Publish package to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     user: __token__
      #     password: ${{ secrets.PYPI_API_TOKEN }}
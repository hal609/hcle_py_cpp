name: Build aarch64 macOS Wheels with caching

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  # Define VCPKG_ROOT with the correct path syntax for all runners.
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build_macos_wheels:
    name: Build arm64 wheels on macOS
    runs-on: macos-latest

    steps:
      - name: Check out the repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # This step reads the commit hash from your checked-out vcpkg submodule.
      - name: Get vcpkg submodule commit hash
        id: get_vcpkg_commit
        run: |
          cd ${{ env.VCPKG_ROOT }}
          echo "commit_id=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        shell: bash

      # The run-vcpkg action is now configured to use the existing submodule.
      # It will handle caching automatically based on the commit and dependencies.
      - name: Install C++ dependencies with vcpkg
        uses: lukka/run-vcpkg@v11.5
        with:
          # Point to the submodule directory
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          # Instruct the action to use the specific commit from the submodule, preventing a new clone.
          vcpkgGitCommitId: ${{ steps.get_vcpkg_commit.outputs.commit_id }}
          # Let the action handle installation from your vcpkg.json
          runVcpkgInstall: true

      - name: Check vcpkg installation
        run: |
          echo "VCPKG_ROOT is: ${{ env.VCPKG_ROOT }}"
          ls "${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.2
        env:
          CIBW_CMAKE_ARGS: "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake --log-level=VERBOSE"

      - name: Store wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-macos-arm64
          path: ./wheelhouse/*.whl

  publish_wheels:
    name: Publish wheels to PyPI
    needs: [build_macos_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-wheels-*
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

